<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>맨몸근력노트</title>
<meta name="theme-color" content="#0B6E83"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>html{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: 카본 그라파이트 바탕에 페트롤(청록) 한 가지 포인트, 휴식은 청동색. 숫자는 좁은 고딕, 제목은 굵은 고딕. 하단 탭 4개, 운동 중에는 전체 화면. */
:root{
  --bg:#F1F3F4; --surface:#FFFFFF; --surface2:#E8ECEE; --ink:#0F1417; --muted:#58646D; --line:#DAE0E3;
  --accent:#0B6E83; --on-accent:#FFFFFF; --accent-soft:#DDEEF2; --bar:#9FCBD6;
  --rest:#9C5A08; --on-rest:#FFFFFF; --rest-soft:#F5E6D0; --gold:#8A5A00; --danger:#B3261E;
  --skin:#E9B994; --shorts:#2B3138; --hair:#352B27; --shoe:#FFFFFF; --hl:#E4572E; --mat:#C9D0D4;
  --shadow:0 1px 2px rgba(15,20,23,.05),0 6px 18px rgba(15,20,23,.04);
  --f-display:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  --f-body:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  --f-num:'Barlow Condensed','Noto Sans KR',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0E11; --surface:#11171B; --surface2:#192026; --ink:#E8EDF0; --muted:#8C99A3; --line:#222B32;
    --accent:#52C4DD; --on-accent:#05171C; --accent-soft:#0E2B33; --bar:#1D5A69;
    --rest:#E3A650; --on-rest:#1C1204; --rest-soft:#2B1E0B; --gold:#E3B341; --danger:#FF8A80; color-scheme:dark;
    --skin:#D9A27C; --shorts:#4D5968; --hair:#8A735F; --shoe:#F3F4F6; --hl:#FF7A59; --mat:#263038; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0E11; --surface:#11171B; --surface2:#192026; --ink:#E8EDF0; --muted:#8C99A3; --line:#222B32;
  --accent:#52C4DD; --on-accent:#05171C; --accent-soft:#0E2B33; --bar:#1D5A69;
  --rest:#E3A650; --on-rest:#1C1204; --rest-soft:#2B1E0B; --gold:#E3B341; --danger:#FF8A80; color-scheme:dark;
  --skin:#D9A27C; --shorts:#4D5968; --hair:#8A735F; --shoe:#F3F4F6; --hl:#FF7A59; --mat:#263038; --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
.wrap{max-width:480px;margin:0 auto;padding-block:20px 104px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500}
h1{font-family:var(--f-display);font-weight:800;font-size:29px;line-height:1.2;letter-spacing:-.03em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.25;letter-spacing:-.025em;text-wrap:balance}
h3{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.top{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
.sec{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.hero{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;min-width:0}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:700;white-space:nowrap}
.meta{font-size:13px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:52px;border:0;border-radius:14px;letter-spacing:-.01em;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;padding:0 18px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--surface2);color:var(--ink)}
.btn.sm{min-height:38px;width:auto;font-size:14px;padding:0 14px;border-radius:10px}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn[disabled]{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.exlist{display:flex;flex-direction:column}
.exrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.exrow:first-child{border-top:0}
.exrow .thumb{flex:0 0 64px}
.exrow .nm{font-weight:700;min-width:0}
.exrow .sub{font-size:13px;color:var(--muted)}
.exrow .grow{flex:1;min-width:0}
.thumb{background:var(--surface2);border-radius:8px;overflow:hidden}
.fig{display:block;width:100%;height:auto}
.fig path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .skin{stroke:var(--skin)}
.fig .shirt{stroke:var(--accent)}
.fig .shorts{stroke:var(--shorts)}
.fig .shoe{stroke:var(--shoe)}
.fig .hlc{stroke:var(--hl);opacity:.62}
.fig .far{opacity:.62}
.fig .c-skin{fill:var(--skin)}
.fig .c-hair{fill:var(--hair)}
.fig .c-shorts{fill:var(--shorts)}
.fig .c-hl{fill:var(--hl);opacity:.62}
.fig .c-eye{fill:#1b1b1f}
.fig .mat{fill:var(--mat)}
.fig .prop{fill:var(--line)}
.fig .mark{fill:none;stroke:var(--accent);stroke-width:1.8}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
.wd i{display:grid;place-items:center;width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line);font-style:normal;font-family:var(--f-num);font-size:15px;color:var(--ink)}
.wd.plan i{border:1.5px solid var(--accent);color:var(--accent)}
.wd.done i{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.wd.today b{color:var(--ink)}
.wd.today i{box-shadow:0 0 0 3px var(--accent-soft)}
.dayrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.dayrow:first-child{border-top:0}
.dayrow .d{flex:0 0 36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.dayrow .grow{flex:1;min-width:0}
.dayrow small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-num);font-size:34px;line-height:1;font-weight:700}
.stat .v small{font-size:15px;font-weight:600;margin-left:2px;color:var(--muted)}
.stat .l{font-size:12px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 0;font-size:12px;color:var(--muted);font-weight:500;min-height:52px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--line);background:transparent;font-weight:500;font-size:14px}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lib{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 12px;min-width:0}
.lib .nm{font-weight:700;padding-inline:4px}
.lib .sub{font-size:12.5px;color:var(--muted);padding-inline:4px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;height:34px;border-radius:8px;font-weight:500;font-size:14px}
.seg button.on{background:var(--surface);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:12px;color:var(--muted);padding-bottom:4px}
.cal .c{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:10px;font-family:var(--f-num);font-size:15px}
.cal .c.plan{box-shadow:inset 0 0 0 1.5px var(--line)}
.cal .c.done{background:var(--accent);color:var(--on-accent);font-weight:700}
.cal .c.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .c.out{visibility:hidden}
.ct{fill:var(--muted);font-family:var(--f-num);font-size:11px}
.cv{fill:var(--ink);font-family:var(--f-num);font-size:12px;font-weight:600}
.pr{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.pr:first-child{border-top:0}
.pr .grow{flex:1;min-width:0}
.pr .val{font-family:var(--f-num);font-size:26px;font-weight:700;line-height:1}
.pr .val small{font-size:13px;color:var(--muted);margin-left:2px}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13.5px}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.opt b{font-size:16px}
.opt span{font-size:13px;color:var(--muted)}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.g2{display:grid;grid-template-columns:1fr 1fr}
.dots{display:flex;gap:6px}
.dots i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--accent)}
.layer{position:fixed;inset:0;z-index:20}
.backdrop{position:absolute;inset:0;background:rgba(10,12,14,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.steps{display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px}
.steps li::before{content:counter(s);flex:0 0 22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-family:var(--f-num);font-weight:700;display:grid;place-items:center;font-size:13px;margin-top:2px}
.tip{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.stage{background:var(--surface2);border-radius:14px;overflow:hidden}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair p{font-size:12px;color:var(--muted);text-align:center;padding-top:4px}
.run{background:var(--bg);display:flex;flex-direction:column;--phase:var(--accent);--on-phase:var(--on-accent);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.run.rest{--phase:var(--rest);--on-phase:var(--on-rest)}
.run .band{background:var(--phase);color:var(--on-phase);padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px}
.run .band .row{max-width:480px;margin:0 auto;width:100%}
.run .ph{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em}
.run .ib{border:0;background:rgba(255,255,255,.18);color:inherit;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.run .prog{height:4px;border-radius:2px;background:rgba(255,255,255,.3);max-width:480px;margin:0 auto;width:100%;overflow:hidden}
.run .prog i{display:block;height:100%;background:var(--on-phase)}
.run .body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;max-width:480px;margin:0 auto;width:100%}
.run .stage .fig{max-height:34vh;margin:0 auto}
.run .tnum{font-family:var(--f-num);font-weight:700;font-size:104px;line-height:.9;text-align:center;font-variant-numeric:tabular-nums}
.run .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.run .bar i{display:block;height:100%;width:0;background:var(--phase)}
.run .info{text-align:center;display:flex;flex-direction:column;gap:2px}
.run .info b{font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:-.025em}
.run .ctrl{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:10px 16px 14px;max-width:480px;margin:0 auto;width:100%}
.run .ctrl.one{grid-template-columns:1fr}
.run .btn.phase{background:var(--phase);color:var(--on-phase)}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:22px;line-height:1}
.stepper .num{font-size:34px;font-weight:700;min-width:84px;text-align:center}
.quit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.big{font-family:var(--f-num);font-size:56px;font-weight:700;line-height:1}
.av{flex:0 0 40px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px}
.av.lg{flex-basis:60px;width:60px;height:60px;font-size:26px}
.uwho{display:flex;align-items:center;gap:10px;min-width:0}
.urow{flex-direction:row;align-items:center;gap:14px}
.urow>span:not(.av){display:flex;flex-direction:column;gap:2px}
.opt .av{color:#fff;font-size:17px}
.opt .av.lg{font-size:26px}
.field{width:100%;min-height:52px;font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:0 14px}
.field.pin{font-family:var(--f-num);font-size:26px;letter-spacing:.35em;font-weight:600}
.field:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.panel{display:flex;flex-direction:column;gap:8px;background:var(--surface2);border-radius:12px;padding:14px}
.hr{border:0;border-top:1px solid var(--line);width:100%;margin:0}
.fold{border:1px solid var(--line);border-radius:12px;padding:0 12px}
.fold summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:500;font-size:14px}
.fold[open]{padding-bottom:12px;display:flex;flex-direction:column;gap:8px}
.fold[open] summary{margin-bottom:0}
.steps li>span{min-width:0;flex:1}
.animbar{display:flex;flex-direction:column;gap:10px}
input[type=range]{width:100%;accent-color:var(--accent);height:28px;margin:0}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:10px;background:var(--surface2);color:var(--muted);font-size:11.5px;font-weight:700;white-space:nowrap;vertical-align:middle}
.tag.warn{background:var(--danger);color:var(--bg)}
.warnbox{border:1.5px solid var(--danger);border-radius:10px;padding:10px 12px;font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill.pain.on{background:var(--danger);border-color:var(--danger);color:var(--bg)}
.logrow{border-top:1px solid var(--line)}
.logrow:first-child{border-top:0}
.loghead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:12px 0}
.loghead .d{flex:0 0 44px;font-size:20px;font-weight:700;color:var(--accent)}
.loghead .grow{flex:1;min-width:0}
.loghead small{display:block;color:var(--muted);font-size:12.5px}
.logbody{padding:0 0 12px 56px;display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.lrow .num{font-size:17px;font-weight:600;text-align:right}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:none;min-height:64px}
textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.rpe{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rpe button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;padding:0 2px}
.rpe button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.legend{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:50%;background:var(--hl);opacity:.7}
.sync{display:flex;gap:10px;align-items:flex-start}
.sync i{flex:0 0 10px;height:10px;border-radius:50%;margin-top:7px;background:var(--muted)}
.sync.on i{background:var(--rest)}
.sync.err i{background:var(--danger)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.foot{text-align:center;font-size:12px;line-height:1.7;color:var(--muted);padding:4px 20px 28px}
.savebar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;padding:0 12px 10px;pointer-events:none}
.savebar>div{pointer-events:auto;max-width:480px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 10px 10px 16px;box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:14px;font-weight:600}
.savebar>div>span{flex:1}
.savebar .ok{color:var(--accent)}
.savebar .btn{width:auto;min-width:76px}
.nbk{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.nbox{background:var(--surface);color:var(--ink);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px 20px calc(18px + env(safe-area-inset-bottom,0px));max-height:82vh;overflow:auto;box-shadow:0 -8px 40px rgba(0,0,0,.25)}
.nlist{margin:8px 0 0;padding-left:18px;list-style:disc;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.5}
.vtag{display:inline-block;vertical-align:middle;margin-left:6px;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:700;letter-spacing:.02em;position:relative;top:-2px}
</style>

<div id="root"></div>
<div id="layer"></div>

<script>
(function(){
'use strict';
var KEY='homegym-v1';
var $=function(s,r){return (r||document).querySelector(s)};
var GN={upper:'상체',lower:'하체',core:'코어',full:'전신'};
var LVN=['초급','중급','고급'];
var WDN=['일','월','화','수','목','금','토'];
var REDUCE=false;
/* 동작 그림의 움직임은 앱의 핵심 내용이라 기기의 '움직임 줄이기' 설정과 상관없이 항상 재생해요 */

/* ---------- 동작 애니메이션: 관절 보간 + 2관절 IK ---------- */

    for(var i=0;i<months.length;i++){

      var rd=await col.doc(mk).get(),rlogs=(rd.exists&&rd.data()&&rd.data().logs)||[],have={};
      logs.forEach(function(l){have[l.id]=1});

async function syncUserData(){

  var cur=DEV.cur.id;
  try{
    SYNC.state='syncing';
    var pfx=SYNC.pfx,db=SYNC.db,uid=SYNC.uid;
    var snap=await db.collection('data/users/'+uid).get(),rs=null,rl=[];
    snap.docs.forEach(function(d){var x=d.data();if(!x)return;if(d.id===pfx+'state')rs=x;else if(d.id.indexOf(pfx+'logs_')===0&&Array.isArray(x.logs))rl=rl.concat(x.logs)});
    if(!DEV.cur||DEV.cur.id!==cur)return;
    var tomb=S.tomb.slice();((rs&&rs.tomb)||[]).forEach(function(t){if(tomb.indexOf(t)<0)tomb.push(t)});
    var changed=false;
    if(rs&&rs.profile&&(rs.updatedAt||0)>(S.updatedAt||0)){
      S.profile=rs.profile;S.plan=rs.plan||makePlan(rs.profile);S.settings=Object.assign({work:40,sound:true},rs.settings);S.updatedAt=rs.updatedAt;
      ui.ob=null;changed=true;

    var have={};S.logs.forEach(function(l){have[l.id]=1});
    rl.forEach(function(l){if(l&&l.id&&l.date&&Array.isArray(l.ex)&&!have[l.id]&&tomb.indexOf(l.id)<0){S.logs.push(l);have[l.id]=1;changed=true}});
    S.logs=S.logs.filter(function(l){return l.sample||tomb.indexOf(l.id)<0});
    S.tomb=tomb;
    var rem={};rl.forEach(function(l){rem[l.id]=1});
    S.logs.forEach(function(l){if(!l.sample&&!rem[l.id])SYNC.dirty[monthKey(l.date)]=1});
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    SYNC.state='on';SYNC.last=Date.now();
    if(SYNC.stateDirty||Object.keys(SYNC.dirty).length)pushSync();
    if(changed&&!ui.run)renderAll();else refreshSync();
  }catch(e){SYNC.state='error';SYNC.err='계정 저장에 연결하지 못했어요.';refreshSync()}
}

  var n=Math.max(3,Math.min(poolN,Math.round(total/3)));
  var sets=Math.max(2,Math.min(Math.min(p.level===1?4:5,adj(p).cap),Math.round(total/n)));
  var days=SPLIT[p.days].map(function(kind,i){
    var light=p.days===7&&i===6,k=light?'mix':kind,s2=light?Math.max(2,sets-1):sets;
    var items=pickDay(k,p.level,light?['full']:fl(p.focus),n,i,pain).map(function(e){return {id:e.id,sets:s2,target:tgt(e,p,p.level)}});
    return {wd:WDSET[p.days][i],kind:kind,light:light,title:light?'가벼운 전신 · 회복':SPLITT[kind],items:items};
  });
  return {days:days};
}
function dayMin(day){var lv=S.profile.level,w=S.settings.work,r=restSec(lv);var s=0;day.items.forEach(function(it){var ex=EXM[it.id];s+=it.sets*((ex.hold?it.target:w)+r)});return Math.max(5,Math.round(s/60))}
function daySets(day){return day.items.reduce(function(a,it){return a+it.sets},0)}

/* ---------- 기록/통계 계산 ---------- */
function volOf(l){return l.ex.reduce(function(a,e){return a+(e.hold?0:e.sets.reduce(function(x,y){return x+y},0))},0)}
function logDates(){var m={};S.logs.forEach(function(l){m[l.date]=1});return m}
function plannedWd(wd){return S.plan&&S.plan.days.some(function(d){return d.wd===wd})}
function streaks(){
  var m=logDates(),today=new Date(),cur=0,d=new Date(today.getFullYear(),today.getMonth(),today.getDate()),guard=0;
  while(guard++<800){
    if(m[ymd(d)])cur++;
    else if(!plannedWd(d.getDay()))null;
    else if(ymd(d)!==ymd(today))break;
    d=addDays(d,-1);
  }
  var best=0;
  if(S.logs.length){
    var first=S.logs.map(function(l){return l.date}).sort()[0],c=0,x=pdate(first);
    while(ymd(x)<=ymd(today)){
      if(m[ymd(x)]){c++;if(c>best)best=c}
      else if(plannedWd(x.getDay())&&ymd(x)!==ymd(today))c=0;
      x=addDays(x,1);
    }
  }
  return {cur:cur,best:Math.max(best,cur)};
}
function bestMap(){
  var b={};
  S.logs.forEach(function(l){l.ex.forEach(function(e){var v=Math.max.apply(null,e.sets.concat([0]));if(!b[e.id]||v>b[e.id].val||v===b[e.id].val&&l.date>b[e.id].date)b[e.id]={val:v,date:l.date}})});
  return b;
}
function weekCount(){var ws=ymd(weekStart(new Date())),m={};S.logs.forEach(function(l){if(l.date>=ws)m[l.date]=1});return Object.keys(m).length}
function series(metric){
  var ws=weekStart(new Date()),out=[];
  for(var k=7;k>=0;k--)out.push({s:addDays(ws,-7*k),v:0});
  S.logs.forEach(function(l){
    var w=weekStart(pdate(l.date)).getTime();
    out.forEach(function(o){if(o.s.getTime()===w)o.v+=metric==='time'?l.durationSec/60:volOf(l)});
  });
  return out;
}
function niceMax(v){if(v<=0)return 10;var p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p,n=f<=1?1:f<=2?2:f<=5?5:10;return n*p}
function makeSample(){
  var today=new Date(),lv=S.profile.level,W=S.settings.work,R=restSec(lv),out=[];
  for(var k=41;k>=1;k--){
    var d=addDays(today,-k),day=S.plan.days.filter(function(x){return x.wd===d.getDay()})[0];
    if(!day||(d.getDate()+d.getMonth())%7===3)continue;
    var ramp=Math.floor((41-k)/14),dur=0;
    var ex=day.items.map(function(it){
      var e=EXM[it.id],sets=[];
      for(var s=0;s<it.sets;s++){
        var v=e.hold?Math.min(it.target+10,it.target-5+ramp*5):Math.max(3,it.target-2+ramp-(s===it.sets-1?1:0));
        sets.push(v);dur+=(e.hold?it.target:W)+R;
      }
      return {id:it.id,hold:!!e.hold,sets:sets};
    });
    out.push({id:'s'+k,date:ymd(d),startedAt:d.getTime(),durationSec:Math.round(dur*.92),title:day.title,ex:ex,sample:true});
  }
  return out;
}

function nextDay(){

  return best;
}

function chartSVG(sr,mx,met){
  var W=340,H=176,L=34,R=332,TP=18,B=140,pw=(R-L)/sr.length,bw=pw*.56,h='<svg viewBox="0 0 '+W+' '+H+'" style="display:block;width:100%;height:auto" role="img" aria-label="최근 8주 '+(met==='time'?'운동 시간':'볼륨')+' 막대 그래프">';
  [0,.5,1].forEach(function(f){
    var y=B-(B-TP)*f;
    h+='<line x1="'+L+'" x2="'+R+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text class="ct" x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(mx*f)+'</text>';
  });
  sr.forEach(function(o,i){
    var x=L+i*pw+(pw-bw)/2,hh=(B-TP)*o.v/mx,cur=i===sr.length-1;
    if(o.v>0)h+='<rect x="'+x.toFixed(1)+'" y="'+(B-hh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'" rx="3" fill="'+(cur?'var(--accent)':'var(--bar)')+'"/><text class="cv" x="'+(x+bw/2).toFixed(1)+'" y="'+(B-hh-5).toFixed(1)+'" text-anchor="middle">'+Math.round(o.v)+'</text>';
    h+='<text class="ct" x="'+(x+bw/2).toFixed(1)+'" y="158" text-anchor="middle">'+(o.s.getMonth()+1)+'/'+o.s.getDate()+'</text>';
  });
  h+='<text class="ct" x="'+R+'" y="172" text-anchor="end">주 시작일(월요일)</text></svg>';
  return h;
}

function lockSection(){

  if(!l){
    h+=on?'<div class="row" style="gap:8px"><button class="btn sm soft" data-a="lockset" data-v="change">PIN 바꾸기</button><button class="btn sm ghost" data-a="lockset" data-v="off">잠금 끄기</button></div>':'<button class="btn sm soft" data-a="lockset" data-v="on">잠금 켜기</button>';
  }else{
    var inp=function(id,lab){return '<label class="note" for="'+id+'">'+lab+'</label><input class="field pin" id="'+id+'" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off">'};
    h+='<div class="opts">'+(l.mode!=='on'?inp('lk0','현재 PIN'):'')+(l.mode!=='off'?inp('lk1',l.mode==='on'?'PIN (숫자 4~6자리)':'새 PIN')+inp('lk2','PIN 확인'):'')+(l.err?'<p class="note" style="color:var(--danger)">'+esc(l.err)+'</p>':'')+'<div class="row" style="gap:8px"><button class="btn sm" data-a="locksave">'+(l.mode==='off'?'잠금 끄기':'저장')+'</button><button class="btn sm ghost" data-a="lockcancel">취소</button></div></div>';
  }

async function lockSave(){
  var l=ui.lockSet;if(!l)return;
  var v=function(id){var e=$('#'+id);return e?e.value:''},err=function(m){ui.lockSet.err=m;renderMain()};
  if(l.mode!=='on'){var c=S.settings.lock;if(!validPin(v('lk0'))||await hashPin(c.salt,v('lk0'))!==c.hash)return err('현재 PIN이 맞지 않아요.')}
  if(l.mode==='off'){delete S.settings.lock;save();ui.lockSet=null;ui.msg='잠금을 껐어요.';renderMain();return}
  var p1=v('lk1'),p2=v('lk2');
  if(!validPin(p1))return err('PIN은 숫자 4~6자리로 입력해 주세요.');
  if(p1!==p2)return err('PIN이 서로 달라요.');
  var salt=rid(8);S.settings.lock={salt:salt,hash:await hashPin(salt,p1)};save();ui.lockSet=null;ui.msg=l.mode==='on'?'잠금을 켰어요.':'PIN을 바꿨어요.';renderMain();
}
async function lockTry(){
  var a=ui.lockUi=ui.lockUi||{},now=Date.now();
  if(a.until&&now<a.until){a.err='잠시 후 다시 시도해 주세요. ('+Math.ceil((a.until-now)/1000)+'초)';renderMain();return}
  var p=($('#lockin')||{}).value||'',c=S.settings.lock;
  if(c&&validPin(p)&&await hashPin(c.salt,p)===c.hash){ui.locked=false;ui.lockUi=null;renderAll();return}
  a.n=(a.n||0)+1;a.err='PIN이 맞지 않아요.';
  if(a.n>=5){a.until=Date.now()+30000;a.n=0;a.err='5번 틀렸어요. 30초 뒤에 다시 시도해 주세요.'}
  renderMain();
}

/* ---------- 운동 진행 ---------- */
function totalSets(r){return r.items.reduce(function(a,it){return a+it.sets},0)}
function doneSets(r){return r.rec.reduce(function(a,x){return a+x.sets.length},0)}
function fmt(s){return s>=60?Math.floor(s/60)+':'+pad(s%60):''+s}
function runHTML(){
  var r=ui.run;
  if(r.phase==='done')return doneHTML(r);
  var rest=r.phase==='rest',nx=rest?r.items[r.nx.i]:r.items[r.i],sIdx=rest?r.nx.set:r.set,ex=nx.ex;
  var ph=r.phase==='ready'?'준비':rest?'휴식':(ex.hold?'버티기':'운동');
  var left=r.paused?r.leftAtPause:r.end-Date.now(),s=Math.max(0,Math.ceil(left/1000)),pct=Math.min(100,Math.max(0,100*(1-left/r.dur)));
  var h='<div class="layer run'+(rest?' rest':'')+'"><div class="band"><div class="row"><button class="ib" data-a="quit" aria-label="운동 종료">✕</button><span class="ph">'+ph+(r.paused?' · 일시정지':'')+'</span><button class="ib" data-a="sound" aria-label="소리 켜기 끄기">'+(S.settings.sound?'♪':'×')+'</button></div><div class="prog"><i style="width:'+(100*doneSets(r)/totalSets(r)).toFixed(1)+'%"></i></div></div><div class="body">';
  if(r.confirm){
    h+='<div class="quit"><b>운동을 끝낼까요?</b><p class="note">지금까지 한 '+doneSets(r)+'세트는 기록으로 남길 수 있어요.</p>'+(doneSets(r)?'<button class="btn" data-a="qsave">기록하고 종료</button>':'')+'<button class="btn ghost" data-a="qdrop">저장하지 않고 종료</button><button class="btn soft" data-a="qcancel">계속하기</button></div>';
  }
  h+='<div class="stage">'+figSVG(ex,{anim:(r.phase==='ready'||rest)?'once':1,t0:r.t0})+'</div>';
  h+='<div class="info">'+(rest?'<span class="meta">다음 동작</span>':'')+'<b>'+ex.name+'</b><span class="meta num">세트 '+(sIdx+1)+' / '+nx.sets+' · '+(ex.hold?'버티기 ':'목표 ')+nx.target+unit(ex)+'</span></div>';
  if(r.phase==='ready'||rest)h+='<p class="meta" id="demo" style="text-align:center;margin-top:-4px">시범 동작을 한 번 보여드려요</p>';
  h+='<div class="tnum" id="tnum" data-s="'+s+'">'+fmt(s)+'</div><div class="bar"><i id="tbar" style="width:'+pct.toFixed(1)+'%"></i></div>';
  if(rest&&r.last){
    var le=r.rec[r.last.i],v=le.sets[r.last.si];
    h+=le.hold?'<p class="meta" style="text-align:center">방금 세트 <b class="num">'+v+'초</b> 버텼어요</p>':'<div><p class="meta" style="text-align:center;margin-bottom:6px">방금 세트에서 한 횟수</p><div class="stepper"><button data-a="rep" data-v="-1" aria-label="1회 줄이기">−</button><span class="num">'+v+'회</span><button data-a="rep" data-v="1" aria-label="1회 늘리기">+</button></div></div>';
  }
  h+='</div>';
  if(r.phase==='ready')h+='<div class="ctrl one"><button class="btn phase" data-a="runSkip">바로 시작</button></div>';
  else if(rest)h+='<div class="ctrl"><button class="btn ghost" data-a="runPlus">+10초</button><button class="btn phase" data-a="runSkip">휴식 건너뛰기</button></div>';
  else h+='<div class="ctrl"><button class="btn ghost" data-a="runPause">'+(r.paused?'계속':'일시정지')+'</button><button class="btn phase" data-a="runDone">'+(ex.hold?'여기까지':'세트 완료')+'</button></div>';
  return h+'</div>';
}
function doneHTML(r){
  var sm=r.summary,lg=r.logRef;
  return '<div class="layer run"><div class="band"><div class="row"><span class="ph">운동 완료</span></div></div><div class="body"><h1 style="margin-top:6px">수고했어요</h1>'+
   '<div class="stats3"><div class="stat"><span class="v">'+Math.max(1,Math.round(sm.dur/60))+'<small>분</small></span><span class="l">운동 시간</span></div><div class="stat"><span class="v">'+sm.sets+'<small>세트</small></span><span class="l">완료</span></div><div class="stat"><span class="v">'+sm.reps+'<small>회</small></span><span class="l">총 반복</span></div></div>'+
   (sm.prs.length?'<section class="card"><h3 style="margin-bottom:6px">새 최고 기록</h3>'+sm.prs.map(function(p){return '<div class="row" style="padding:6px 0"><b>'+EXM[p.id].name+'</b><span class="big" style="font-size:30px;color:var(--accent)">'+p.val+'<small style="font-size:14px;color:var(--muted)">'+unit(EXM[p.id])+'</small></span></div>'}).join('')+'</section>':'')+
   '<div><h3 style="margin-bottom:8px">오늘 운동은 어땠나요?</h3><div class="rpe">'+RPE.map(function(t,i){return '<button class="'+(lg&&lg.rpe===i+1?'on':'')+'" data-a="rpe" data-v="'+(i+1)+'">'+t+'</button>'}).join('')+'</div></div>'+
   '<div><label for="note" class="note" style="display:block;margin-bottom:6px">메모 (선택)</label><textarea id="note" maxlength="200" placeholder="컨디션, 아픈 곳, 다음에 바꿀 점">'+esc(lg&&lg.note||'')+'</textarea></div>'+
   '<p class="meta">기록을 저장했어요. 확인을 누르면 메모와 체감 강도도 함께 저장돼요.</p></div><div class="ctrl one"><button class="btn phase" data-a="runClose">확인</button></div></div>';
}
function startRun(wd){
  var day=S.plan.days.filter(function(d){return d.wd===wd})[0];if(!day)return;
  var lv=S.profile.level,W=S.settings.work,now=Date.now();
  var items=day.items.map(function(it){var ex=EXM[it.id];return {ex:ex,sets:it.sets,target:it.target,work:ex.hold?it.target:W,rest:restSec(lv)}});
  var rd=Math.max(5000,600+cycMs(items[0].ex)+1500);
  ui.run={day:day,items:items,i:0,set:0,phase:'ready',t0:performance.now(),startedAt:now,pausedMs:0,paused:false,confirm:false,last:null,nx:null,dur:rd,start:now,end:now+rd,
    rec:items.map(function(it){return {id:it.ex.id,hold:!!it.ex.hold,sets:[]}})};
  audioInit();lock();renderLayer();
}
function startWork(){var r=ui.run,now=Date.now(),it=r.items[r.i];r.phase='work';r.dur=it.work*1000;r.start=now;r.end=now+r.dur;beep(880,.25)}
function finishAll(){
  var r=ui.run,now=Date.now();
  var ex=r.rec.filter(function(x){return x.sets.length}).map(function(x){return {id:x.id,hold:x.hold,sets:x.sets.slice()}});
  var prev=bestMap(),prs=[];
  ex.forEach(function(e){var v=Math.max.apply(null,e.sets);if(prev[e.id]&&v>prev[e.id].val)prs.push({id:e.id,val:v})});
  var dur=Math.round((now-r.startedAt-r.pausedMs)/1000);
  var log={id:'l'+now,date:ymd(new Date(r.startedAt)),startedAt:r.startedAt,durationSec:dur,title:r.day.title,ex:ex};
  S.logs.push(log);r.logRef=log;
  save({state:false,months:[monthKey(log.date)]});
  r.phase='done';r.confirm=false;
  r.summary={dur:dur,sets:ex.reduce(function(a,e){return a+e.sets.length},0),reps:ex.reduce(function(a,e){return a+(e.hold?0:e.sets.reduce(function(x,y){return x+y},0))},0),prs:prs};
  unlock();beep(988,.35);
}
function finishSet(){
  var r=ui.run,now=Date.now(),it=r.items[r.i],el=Math.min(r.dur,now-r.start)/1000;
  r.rec[r.i].sets.push(it.ex.hold?Math.max(1,Math.round(el)):it.target);
  r.last={i:r.i,si:r.set};
  var lastSet=r.set+1>=it.sets,lastItem=r.i+1>=r.items.length;
  if(lastSet&&lastItem){finishAll();return}
  r.nx=lastSet?{i:r.i+1,set:0}:{i:r.i,set:r.set+1};
  r.phase='rest';r.dur=it.rest*1000;r.end=now+r.dur;r.t0=performance.now();beep(520,.2);
}
function endPhase(){
  var r=ui.run;
  if(r.phase==='ready')startWork();
  else if(r.phase==='work')finishSet();
  else if(r.phase==='rest'){r.i=r.nx.i;r.set=r.nx.set;startWork()}
  renderLayer();
}
function pauseRun(){var r=ui.run,now=Date.now();if(!r.paused){r.paused=true;r.leftAtPause=r.end-now;r.pausedAt=now}}
function resumeRun(){var r=ui.run,now=Date.now();if(r.paused){r.end=now+r.leftAtPause;r.start+=now-r.pausedAt;r.pausedMs+=now-r.pausedAt;r.paused=false}}
function tick(){
  var r=ui.run;if(!r||r.phase==='done'||r.paused)return;
  var left=r.end-Date.now(),s=Math.max(0,Math.ceil(left/1000)),n=$('#tnum');
  if(n&&n.dataset.s!==''+s){n.dataset.s=''+s;n.textContent=fmt(s);if(s<=3&&s>0)beep(660,.08)}
  var b=$('#tbar');if(b)b.style.width=Math.min(100,100*(1-left/r.dur)).toFixed(1)+'%';
  if(left<=0)endPhase();
}
setInterval(tick,150);

/* ---------- 렌더 ---------- */
function renderMain(){
  var el=$('#root');
  if(!DEV.cur){el.innerHTML=authView()+foot();var fe=$('#pinin')||$('#rname');if(fe)try{fe.focus()}catch(e){}return}
  if(ui.locked&&lockOn()){el.innerHTML=lockView();var lf=$('#lockin');if(lf)try{lf.focus()}catch(e){}return}
  if(S.profile&&!S.plan){S.plan=makePlan(S.profile);save()}
  if(!S.profile||ui.ob){
    if(!ui.ob)ui.ob={step:0,level:null,days:null,minutes:null,focus:null};
    el.innerHTML=onboardView()+(ui.ob.step===0?foot():'');return;
  }
  var v=ui.tab==='today'?todayView():ui.tab==='lib'?libView():ui.tab==='stats'?statsView():setView();
  el.innerHTML='<div class="wrap">'+v+'</div>'+tabbar();
}
function renderLayer(){
  if(ui.locked&&lockOn()){$('#layer').innerHTML='';return}
  var h='';if(DEV.cur&&S.profile&&!ui.ob){if(ui.sheet)h+=sheetHTML();if(ui.run)h+=runHTML()}
  h+=noticeHTML()+bkHTML()+byeHTML();
  $('#layer').innerHTML=h;
  try{document.body.style.overflow=h?'hidden':''}catch(e){}

function importData(txt){
  try{
    var o=JSON.parse(txt);if(!o||!Array.isArray(o.logs))throw new Error('x');
    var have={},n=0,months={};S.logs.forEach(function(l){have[l.id]=1});
    o.logs.forEach(function(l){
      if(!l||typeof l.id!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(l.date||'')||!Array.isArray(l.ex)||have[l.id]||S.tomb.indexOf(l.id)>=0)return;
      var ex=l.ex.filter(function(e){return e&&EXM[e.id]&&Array.isArray(e.sets)}).map(function(e){return {id:e.id,hold:!!EXM[e.id].hold,sets:e.sets.map(function(v){return Math.max(0,Math.round(+v)||0)})}});
      if(!ex.length)return;
      var c={id:l.id.slice(0,40),date:l.date,startedAt:+l.startedAt||pdate(l.date).getTime(),durationSec:Math.max(0,Math.round(+l.durationSec)||0),title:String(l.title||'운동').slice(0,40),ex:ex};
      if(l.rpe>=1&&l.rpe<=4)c.rpe=Math.round(l.rpe);

  return !!(ui.tab!=='today'||ui.run||ui.sheet||ui.bk||ui.notice||ui.ob);
}
function syncGuard(){
  var n=needGuard();
  if(n&&!GUARD){try{history.pushState({hg:1},'');GUARD=true}catch(e){}}
  else if(!n&&GUARD){GUARD=false;IGNORE=true;try{history.back()}catch(e){IGNORE=false}}
}
function backHandled(){
  if(ui.locked&&lockOn()){if(ui.lockUi&&ui.lockUi.forgot){clickA('lockback');return true}return false}
  if(ui.notice){return true}
  if(ui.bk){if(ui.bk.result)clickA('bkclose');else clickA('bklater');return true}
  if(ui.run){var r=ui.run;if(r.done){clickA('runClose')}else if(r.confirm){clickA('qcancel')}else{clickA('quit')}return true}
  if(ui.sheet){ui.sheet=null;renderLayer();return true}
  if(ui.ob){if(ui.ob.step>0){ui.ob.step--;renderMain();return true}if(S.profile){ui.ob=null;renderMain();return true}return false}
  if(!DEV.cur)return false;
  if(ui.tab!=='today'){ui.draft=null;ui.tab='today';ui.msg='';window.scrollTo(0,0);renderMain();return true}
  return false;
}
window.addEventListener('popstate',function(){
  if(IGNORE){IGNORE=false;return}
  GUARD=false;backHandled();syncGuard();
});
['click','touchend'].forEach(function(t){document.addEventListener(t,syncGuard,{passive:true})});
(function(){var rm=renderMain,rl=renderLayer;renderMain=function(){rm.apply(this,arguments);syncGuard()};renderLayer=function(){rl.apply(this,arguments);syncGuard()}})();
window.addEventListener('beforeunload',function(e){if(backupDirty()&&!ui.bdismiss){e.preventDefault();e.returnValue=''}});
setTimeout(askBackup,900);
requestAnimationFrame(loop);
initDb();
setTimeout(function(){if(!DEV.ready){DEV.ready=true;if(!DEV.cur)renderMain()}},4000);
})();
</script>
